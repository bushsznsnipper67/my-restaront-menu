
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ My Restaurant Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🍴 Yummy Restaurant 🍴</h1>
    <p>😋 Delicious Food, Happy Mood! 🎉</p>

    <div class="menu-container">

        <!-- Food Item 1 -->
        <div class="food-card">
            <img src="PIZZA-MARGHERITA.jpg" alt="Margherita Pizza">
            <h2>🍕 Margherita Pizza</h2>
            <p class="food-description">Tomato Sauce, Mozzarella Cheese, Fresh Basil 🌿</p>
            <p class="food-price">💲12.99</p>
            <button class="order-button">🛒 Add to Cart</button>
        </div>

        <!-- Food Item 2 -->
        <div class="food-card">
            <img src="ClassicCheeseBurger_9.jpg" alt="Cheeseburger">
            <h2>🍔 Cheeseburger</h2>
            <p class="food-description">Potato Patty, Cheddar Cheese, Lettuce, Tomato, Onion</p>
            <p class="food-price">💲10.99</p>
            <button class="order-button">🛒 Add to Cart</button>
        </div>

        <!-- Food Item 3 -->
        <div class="food-card">
            <img src="Caesar-Salad-9.jpg" alt="Caesar Salad">
            <h2>🥗 Caesar Salad</h2>
            <p class="food-description">Romaine Lettuce, Croutons, Parmesan Cheese, Caesar Dressing</p>
            <p class="food-price">💲8.99</p>
            <button class="order-button">🛒 Add to Cart</button>
        </div>

    </div>

</body>
</html>
